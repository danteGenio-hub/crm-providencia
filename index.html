<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Providencia</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Cliente oficial de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>CRM Prospectos Providencia</h1>
      <div class="stats" id="statsContainer">Cargando datos...</div>
    </header>

    <main>
      <section class="controls">
        <input type="text" id="searchInput" placeholder="Buscar por nombre, dirección o rubro...">
        <select id="filterGaleria">
          <option value="">Todas las galerías</option>
        </select>
        <button id="btnNewLocal" class="btn-primary">+ Nuevo Local</button>
      </section>

      <section class="list-container">
        <div id="localesList" class="locales-grid"></div>
      </section>
    </main>
  </div>

  <!-- Modal Edición/Creación -->
  <div id="editModal" class="modal hidden">
    <div class="modal-content">
      <span class="close-btn" onclick="closeEditModal()">&times;</span>
      <h2 id="modalTitle">Editar Local</h2>
      <form id="editLocalForm">
        <input type="hidden" id="editLocalId">
        
        <label>Nombre del Local:</label>
        <input type="text" id="editNombre" required>

        <label>Rubro:</label>
        <input type="text" id="editRubro">

        <label>Galería / Caracol:</label>
        <select id="editGaleriaPertenece"></select>

        <label>N° Local:</label>
        <input type="text" id="editNumLocal">

        <label>Dirección:</label>
        <input type="text" id="editDireccion">

        <label>WhatsApp / Teléfono:</label>
        <input type="text" id="editWhatsapp">

        <label>Email:</label>
        <input type="email" id="editEmail">

        <div class="checkbox-group">
          <input type="checkbox" id="editTieneMaps">
          <label for="editTieneMaps">¿Tiene Google Maps?</label>
        </div>

        <button type="submit" class="btn-primary">Guardar en la Nube</button>
      </form>
    </div>
  </div>

  <!-- Carga de Scripts en Orden -->
  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
